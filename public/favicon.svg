<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="faviconMetallicGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0b0d14" />
      <stop offset="40%" stop-color="#1e2230" />
      <stop offset="100%" stop-color="#858b9c" />
    </linearGradient>
  </defs>

  <!-- Metallic Slate Gradient Base -->
  <circle cx="32" cy="32" r="30" fill="url(#faviconMetallicGradient)" />
  <circle cx="32" cy="32" r="29.5" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1" />

  <!-- Tilted Rounded Square Diamond (22.5 Degree Rotation) -->
  <rect x="18" y="18" width="28" height="28" rx="6.5" transform="rotate(22.5 32 32)" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linejoin="round" />

  <!-- Center Focal Core Dot -->
  <circle cx="32" cy="32" r="4.5" fill="#ffffff" />
</svg>
